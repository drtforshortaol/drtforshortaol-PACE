<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RCL Prototype</title><style>
:root{font-family:system-ui,sans-serif;color:#173548;background:#f3f8fa}body{margin:0}header{background:#07526a;color:white;padding:1rem}header h1{margin:.2rem 0;font-size:1.35rem}nav{display:flex;gap:.6rem;flex-wrap:wrap}button,input{font:inherit;padding:.65rem;border-radius:.5rem;border:1px solid #9ab7c3}button{cursor:pointer}main{max-width:680px;margin:auto;padding:1rem}input{box-sizing:border-box;width:100%;margin:.7rem 0}details{background:white;border:1px solid #c9dce3;border-radius:.6rem;margin:.75rem 0;padding:1rem}summary{font-weight:700;cursor:pointer}footer{padding:1rem;text-align:center;color:#526872}</style></head>
<body><header><h1 id="title">RCL — First Review Prototype</h1><nav><button id="back">← Back</button><button id="hub">⌂ Return to Hub</button></nav></header><main><p>Reusable app shell, navigation, searchable expandable cards. Sample content only.</p><label for="search">Search cards</label><input id="search" type="search" placeholder="Try ocean or habitat"><div id="cards"></div><p id="empty" hidden>No matching cards.</p></main><footer>RCL v0.1 · Prototype only · No production changes</footer>
<script>
const config={hubUrl:'https://drtforshortaol.github.io/MBA-hub-v2/',cards:[{title:'Ocean science',body:'Prototype educational card for ocean topics.'},{title:'Marine habitats',body:'Prototype species and habitat card.'},{title:'Visitor guidance',body:'Prototype guide reference card.'}]};
const host=document.getElementById('cards'),search=document.getElementById('search');
function render(){const q=search.value.trim().toLowerCase();const matches=config.cards.filter(c=>(c.title+' '+c.body).toLowerCase().includes(q));host.replaceChildren(...matches.map(c=>{const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');s.textContent=c.title;p.textContent=c.body;d.append(s,p);return d}));document.getElementById('empty').hidden=!!matches.length}
search.addEventListener('input',render);render();
document.getElementById('hub').onclick=()=>location.assign(config.hubUrl);
document.getElementById('back').onclick=()=>{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin)history.back();else location.assign(config.hubUrl)};
</script></body></html>
